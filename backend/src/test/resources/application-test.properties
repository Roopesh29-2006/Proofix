# Test profile: integration tests run against the dedicated proofix_test
# database, never against Proofix_db. Credentials still come from
# DB_USERNAME / DB_PASSWORD in the environment.
spring.datasource.url=jdbc:postgresql://localhost:5432/proofix_test

# proofix_test starts empty, so Flyway must execute V1__baseline.sql in full
# instead of baselining over an existing schema.
spring.flyway.baseline-on-migrate=false

spring.jpa.show-sql=false

# TEST-ONLY JWT signing key (random, 48 bytes, base64).
# - Lives under src/test only, so it is never packaged into the application.
# - Not a real credential and must never be used by any running environment.
# - The real application has no fallback: it requires JWT_SECRET.
# JWT_SECRET overrides this value when set.
app.jwt.secret=${JWT_SECRET:Yt4FJC1vEkn2sSSn7EBjip1+e+dXPfvpR7OZUfXinkkjyHaEfCcedqTuJfUiaoE3}

# No scheduled poller/reaper in tests; tests call them directly.
devbuddy.runner.scheduling.enabled=false
