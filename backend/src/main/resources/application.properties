spring.application.name=proofix-backend

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/Proofix_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Server Configuration
server.port=8082

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000

github.api.base-url=https://api.github.com
github.api.timeout-seconds=15
github.api.token=${GITHUB_TOKEN:}
github.scan.max-files=100
github.scan.max-file-size-bytes=1048576
github.scan.max-total-content-bytes=20971520