spring.application.name=proofix-backend

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/Proofix_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway Configuration
# The schema is owned by Flyway (src/main/resources/db/migration).
# An existing, non-empty database without flyway_schema_history is baselined
# at version 1, so V1__baseline.sql is recorded as applied but NOT executed.
# An empty database runs V1 in full.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.clean-disabled=true

# Hibernate Configuration
# Hibernate only validates the entities against the Flyway-managed schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Server Configuration
server.port=8082

# Required. No fallback: if JWT_SECRET is unset the value is empty and the
# application refuses to start (validated in JwtService: base64, >= 32 bytes).
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=3600000

github.api.base-url=https://api.github.com
github.api.timeout-seconds=15
github.api.token=${GITHUB_TOKEN:}
github.scan.max-files=100
github.scan.max-file-size-bytes=1048576
github.scan.max-total-content-bytes=20971520

# Runs (Build 1)
# Budgets applied to every new Run.
devbuddy.runs.defaults.max-minutes=30
devbuddy.runs.defaults.max-gemini-calls=50
devbuddy.runs.defaults.max-users=100
# Maximum QUEUED + active (ANALYZING/TESTING/INVESTIGATING) Runs per user.
devbuddy.runs.max-active-per-user=3
# Maximum unfinished (QUEUED + active + AWAITING_*) Runs per user.
devbuddy.runs.max-unfinished-per-user=10

# Run worker (Build 1)
# The fake executor simulates the work with sleeps. Off: nothing claims Runs.
devbuddy.runner.fake.enabled=false
devbuddy.runner.fake.step-ms=500
devbuddy.runner.fake.steps-per-phase=3
devbuddy.runner.poll-interval-ms=2000
devbuddy.runner.reaper-interval-ms=10000
# A Run with a runner whose heartbeat is older than this is failed.
devbuddy.runner.heartbeat-timeout-ms=30000
# Poller and reaper each get their own scheduler thread.
spring.task.scheduling.pool.size=2
